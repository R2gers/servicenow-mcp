[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "servicenow-mcp"
version = "0.1.0"
description = "ServiceNow MCP Server for Claude Code — query, update, and manipulate any ServiceNow instance with built-in safety guards."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["servicenow", "mcp", "claude", "claude-code", "ai", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/R2gers/servicenow-mcp"
Issues = "https://github.com/R2gers/servicenow-mcp/issues"

[project.scripts]
servicenow-mcp = "servicenow_mcp.server:main_sync"
servicenow-mcp-setup = "servicenow_mcp.setup:main"
